<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StruDiv - View Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b1a2e 0%, #1a2f3f 50%, #1e3a4a 100%);
            min-height: 100vh;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: rgba(10, 25, 35, 0.7) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: #fff !important;
            letter-spacing: -0.02em;
        }
        .navbar-brand img {
            vertical-align: middle;
        }
        .navbar-text {
            color: rgba(220, 240, 255, 0.8) !important;
            font-weight: 400;
        }
        .card {
            background: rgba(20, 40, 55, 0.7) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px !important;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            color: #eaeef2;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 45px -10px rgba(0, 180, 255, 0.3);
        }
        .card-header {
            background: rgba(0, 100, 150, 0.4) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px 24px 0 0 !important;
            padding: 1.2rem 1.5rem;
            font-weight: 600;
            color: white;
        }
        .card-header h4, .card-header .h4 {
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .card-header i {
            margin-right: 0.5rem;
            color: #b0e0ff;
        }
        .card-body {
            padding: 1.8rem;
            color: #dce8f0;
        }
        .form-label {
            font-weight: 500;
            color: #cce2f0;
            margin-bottom: 0.5rem;
        }
        .form-select {
            background-color: rgba(15, 30, 45, 0.9) !important;
            border: 1px solid rgba(100, 180, 255, 0.3) !important;
            border-radius: 16px !important;
            color: #fff !important;
            padding: 0.8rem 1.2rem;
            backdrop-filter: blur(5px);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-select:focus {
            border-color: #00a8e8 !important;
            box-shadow: 0 0 0 3px rgba(0, 168, 232, 0.3) !important;
            outline: none;
        }
        .form-select option {
            background-color: #1e3a4a;
            color: white;
        }
        .btn-custom {
            border-radius: 50px !important;
            padding: 12px 28px !important;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }
        .btn-outline-primary {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(5px);
            border: 1.5px solid rgba(100, 200, 255, 0.4) !important;
            color: #cce9ff !important;
        }
        .btn-outline-primary:hover {
            background: rgba(80, 160, 220, 0.2) !important;
            border-color: #00a8e8 !important;
            color: white !important;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px #00a8e8;
        }
        .result-section {
            max-height: 500000px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #3a6e8f #1e3a4a;
        }
        .result-section::-webkit-scrollbar {
            width: 8px;
        }
        .result-section::-webkit-scrollbar-track {
            background: #1e3a4a;
            border-radius: 10px;
        }
        .result-section::-webkit-scrollbar-thumb {
            background: #3a6e8f;
            border-radius: 10px;
        }
        .result-section::-webkit-scrollbar-thumb:hover {
            background: #4f8fb0;
        }
        .list-group-item {
            background-color: rgba(15, 35, 50, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #e0eefc !important;
            border-radius: 12px !important;
            margin-bottom: 4px;
            backdrop-filter: blur(5px);
        }
        .list-group-item-danger {
            background-color: rgba(180, 40, 40, 0.25) !important;
            border-left: 4px solid #ff5e5e !important;
        }
        .list-group-item .badge {
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
        }
        .alert {
            background: rgba(20, 40, 55, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #f0f6fc;
        }
        .alert-danger {
            background: rgba(150, 40, 40, 0.3);
            border-color: #ff8a8a;
        }
        .alert-info {
            background: rgba(0, 120, 160, 0.25);
            border-color: #6ab0ff;
        }
        .text-muted {
            color: #b0c8dc !important;
        }
        .border {
            border-color: rgba(255,255,255,0.15) !important;
        }
        .spinner-border {
            color: #7ac7ff !important;
        }
        h5, h6, strong {
            color: #ffffff;
        }
        .error-type-item {
            color: #ff8a8a !important;
            font-size: 1.05rem !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="StruDiv Logo" style="height: 5rem; width: auto; margin-right: 0.5rem;">
                StruDiv
            </a>
            <span class="navbar-text">
                Detecting Reasoning Hallucinations through Structural Step Analysis and Divergence Consensus
            </span>
            <div class="ml-auto">
                <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fas fa-file-alt"></i> Experiment Files</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label for="experimentFile" class="form-label">
                                <i class="fas fa-file-alt"></i> Select Experiment File
                            </label>
                            <select class="form-select" id="experimentFile" name="experimentFile">
                                <option value="">-- Loading files... --</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-custom" id="loadFileBtn">
                            <i class="fas fa-file-import"></i> Load Selected File
                        </button>
                    </div>
                </div>

                <div id="fileResultSection" class="mt-4" style="display: none;">
                    <div class="card shadow">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0"><i class="fas fa-chart-bar"></i> Experiment Result</h4>
                        </div>
                        <div class="card-body result-section" id="resultContent">
                            <div class="text-center">
                                <div class="spinner-border spinner-border-sm" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <span>Loading experiment result...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 此处保留原有所有 JavaScript 代码，未作任何修改
        function loadExperimentFiles() {
            document.getElementById('experimentFile').innerHTML = '<option value="">-- Loading files... --</option>';
            fetch('/api/experiment-files')
                .then(response => response.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    const select = document.getElementById('experimentFile');
                    select.innerHTML = '<option value="">-- Select Experiment File --</option>';
                    data.forEach(file => {
                        const option = document.createElement('option');
                        option.value = file.value;
                        option.textContent = file.label;
                        select.appendChild(option);
                    });
                    if (data.length === 0) showToast('No experiment files found', 'info');
                })
                .catch(error => {
                    document.getElementById('experimentFile').innerHTML = '<option value="">-- Error loading files --</option>';
                    showToast('Failed to load experiment files: ' + error.message, 'error');
                });
        }

        document.getElementById('loadFileBtn').addEventListener('click', function() {
            const selectedFile = document.getElementById('experimentFile').value;
            if (!selectedFile) {
                showToast('Please select an experiment file first', 'warning');
                return;
            }
            const btn = document.getElementById('loadFileBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            document.getElementById('fileResultSection').style.display = 'block';
            document.getElementById('resultContent').innerHTML = `
                <div class="text-center">
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <span>Loading experiment result...</span>
                </div>
            `;
            fetch(`/api/experiment-result/${selectedFile}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    displayFileResult(data);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-file-import"></i> Load Selected File';
                    showToast('File loaded successfully!', 'success');
                })
                .catch(error => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-file-import"></i> Load Selected File';
                    showToast('Failed to load file: ' + error.message, 'error');
                    document.getElementById('resultContent').innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle"></i>
                            Failed to load experiment result: ${error.message}
                        </div>
                    `;
                });
        });

        function getNested(obj, path, defaultValue = 'N/A') {
            return path.split('.').reduce((acc, key) => (acc && acc[key] !== undefined) ? acc[key] : defaultValue, obj);
        }

        function displayFileResult(result) {
            if (!result) {
                document.getElementById('resultContent').innerHTML = `<div class="alert alert-danger">Invalid result data</div>`;
                return;
            }
            let html = `
                <h5><i class="fas fa-file-alt"></i> Experiment Result</h5>
                <div class="mb-3">
                    <strong>Dataset:</strong> ${result.batch_info?.dataset || 'N/A'}<br>
                    <strong>Total Samples:</strong> ${result.batch_info?.total_samples || 'N/A'}<br>
                    <strong>Timestamp:</strong> ${result.batch_info?.timestamp ? formatTimestamp(result.batch_info.timestamp) : 'N/A'}<br>
                    <strong>Model:</strong> ${result.batch_info?.config?.model || 'N/A'}
                </div>
            `;
            if (result.results && Array.isArray(result.results) && result.results.length > 0) {
                html += '<h6 class="mt-3">Sample Results:</h6>';
                result.results.forEach((sample, index) => {
                    if (!sample) return;
                    const sampleId = sample.id || sample.sample?.id || getNested(sample, 'sample.id', `Sample ${index+1}`);
                    const groundTruth = sample.ground_truth || sample.sample?.ground_truth || getNested(sample, 'sample.ground_truth', 'Unknown');
                    const riskLevel = sample.hallucination_analysis?.sample_risk_level || sample.hallucination_analysis?.risk_level || sample.risk_level || 'Unknown';
                    const issuesCount = sample.issues_count || sample.hallucination_analysis?.issues_count || 0;
                    const labels = sample.labels || sample.sample?.labels || [];
                    let reasoningChain = null;
                    if (sample.reasoning_chain && Array.isArray(sample.reasoning_chain)) reasoningChain = sample.reasoning_chain;
                    else if (sample.sample?.reasoning_chain && Array.isArray(sample.sample.reasoning_chain)) reasoningChain = sample.sample.reasoning_chain;
                    else if (sample.original_reasoning && Array.isArray(sample.original_reasoning)) reasoningChain = sample.original_reasoning;
                    else if (sample.reasoning && Array.isArray(sample.reasoning)) reasoningChain = sample.reasoning;
                    let groundTruthBadge = '';
                    let truthLabel = String(groundTruth).toLowerCase();
                    if (truthLabel === 'true' || truthLabel === 'true_hard' || truthLabel === 'true_easy') {
                        groundTruthBadge = '<span class="badge bg-success ms-2">Ground Truth: TRUE</span>';
                    } else if (truthLabel === 'false' || truthLabel === 'false_hard' || truthLabel === 'false_easy') {
                        groundTruthBadge = '<span class="badge bg-danger ms-2">Ground Truth: FALSE</span>';
                    } else {
                        groundTruthBadge = `<span class="badge bg-secondary ms-2">Ground Truth: ${groundTruth}</span>`;
                    }
                    html += `
                        <div class="mt-3 p-3 border rounded">
                            <div class="d-flex justify-content-between align-items-center flex-wrap">
                                <div>
                                    <strong>Sample ${index + 1}: ${sampleId}</strong>
                                    ${groundTruthBadge}
                                </div>
                                <div>
                                    <span class="badge bg-${getRiskColor(riskLevel)}">Risk: ${riskLevel}</span>
                                    <span class="badge bg-info ms-1">Issues: ${issuesCount}</span>
                                </div>
                            </div>
                    `;
                    if (reasoningChain && reasoningChain.length > 0) {
                        html += `<div class="mt-3"><strong>Reasoning Chain:</strong><ol class="list-group list-group-numbered mt-2">`;
                        reasoningChain.forEach((step, stepIdx) => {
                            let stepLabel = (labels && labels[stepIdx]) ? `<span class="badge bg-secondary ms-2">${labels[stepIdx]}</span>` : '';
                            html += `<li class="list-group-item d-flex justify-content-between align-items-start">
                                        <span class="flex-grow-1">${step}</span>
                                        ${stepLabel}
                                     </li>`;
                        });
                        html += `</ol></div>`;
                    } else {
                        html += `<div class="alert alert-warning mt-3">No reasoning chain available</div>`;
                    }
                    let diagnosisSteps = null;
                    if (sample.diagnosis?.steps && Array.isArray(sample.diagnosis.steps)) {
                        diagnosisSteps = sample.diagnosis.steps;
                    } else if (sample.reverified_results && Array.isArray(sample.reverified_results)) {
                        diagnosisSteps = sample.reverified_results.map((revResult, idx) => ({
                            label: revResult.label || 'Unknown',
                            issues: revResult.issues || [],
                            step_text: revResult.step_description || revResult.step || '',
                            step_index: revResult.step_index || idx
                        }));
                    } else if (sample.hallucination_analysis?.reverified_results && Array.isArray(sample.hallucination_analysis.reverified_results)) {
                        diagnosisSteps = sample.hallucination_analysis.reverified_results.map((revResult, idx) => ({
                            label: revResult.label || 'Unknown',
                            issues: revResult.issues || [],
                            step_text: revResult.step_description || revResult.step || '',
                            step_index: revResult.step_index || idx
                        }));
                    } else if (sample.hallucination_analysis?.problematic_steps && Array.isArray(sample.hallucination_analysis.problematic_steps)) {
                        diagnosisSteps = sample.hallucination_analysis.problematic_steps.map((probStep, idx) => ({
                            label: probStep.label || 'Unknown',
                            issues: probStep.issues || []
                        }));
                    }
                    const hasIssues = issuesCount > 0;
                    if (hasIssues && diagnosisSteps) {
                        const stepsWithIssues = diagnosisSteps.filter(step => step && step.issues && step.issues.length > 0);
                        if (stepsWithIssues.length > 0) {
                            html += `<div class="mt-3"><strong>Diagnosis (Issues Found):</strong><ul class="list-group mt-2">`;
                            stepsWithIssues.forEach((step, stepIndex) => {
                                let issueHtml = '<ul class="mt-1 mb-0">';
                                step.issues.forEach(issue => { issueHtml += `<li>${issue}</li>`; });
                                issueHtml += '</ul>';
                                html += `<li class="list-group-item list-group-item-danger">
                                            Step ${step.step_index || (stepIndex+1)} (${step.label || 'Unknown'}): ${step.issues.length} issue(s)
                                            ${issueHtml}
                                         </li>`;
                            });
                            html += `</ul></div>`;
                        }
                    } else if (hasIssues && !diagnosisSteps) {
                        html += `<div class="alert alert-danger mt-3">Issues detected but no detailed diagnosis available.</div>`;
                    }
                    if (sample.hallucination_analysis?.error_types && Object.keys(sample.hallucination_analysis.error_types).length > 0) {
                        html += `<div class="mt-3"><strong>Error Types:</strong><ul class="list-group mt-2">`;
                        for (const [label, errors] of Object.entries(sample.hallucination_analysis.error_types)) {
                            if (errors && errors.length) {
                                html += `<li class="list-group-item error-type-item"><strong>${label}:</strong> ${errors.join('; ')}</li>`;
                            }
                        }
                        html += `</ul></div>`;
                    }
                    html += `</div>`;
                });
            } else {
                html += '<div class="alert alert-info mt-3">No results available in this experiment file</div>';
            }
            document.getElementById('resultContent').innerHTML = html;
        }

        function showToast(message, type = 'info') {
            console.log('🔔 Toast message:', message);  // 调试日志
            if (!message) {
                console.warn('Empty message passed to showToast');
                message = 'Notification';
            }
            const container = document.createElement('div');
            container.className = 'position-fixed top-0 end-0 p-3';
            container.style.zIndex = '1100';
            container.style.maxWidth = '350px';
            const icon = type === 'error' ? 'exclamation-triangle' : (type === 'warning' ? 'exclamation-circle' : 'check-circle');
            const iconColor = type === 'error' ? 'text-danger' : (type === 'warning' ? 'text-warning' : 'text-success');
            const toastHtml = `
                <div class="toast show" role="alert" style="background: #1e2a3a; border-left: 4px solid ${type === 'error' ? '#dc3545' : (type === 'warning' ? '#ffc107' : '#28a745')}; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.3);">
                    <div class="toast-header" style="background: #0f212e; color: white; border-bottom: 1px solid #2c4c64;">
                        <i class="fas fa-${icon} ${iconColor} me-2"></i>
                        <strong class="me-auto">StruDiv</strong>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body" style="color: #f0f6fc; background: #1e2a3a; padding: 0.75rem 1rem;">
                        ${message}
                    </div>
                </div>
            `;
            container.innerHTML = toastHtml;
            document.body.appendChild(container);
            setTimeout(() => container.remove(), 5000);
            container.querySelector('.btn-close').addEventListener('click', () => container.remove());
        }

        function formatTimestamp(ts) {
            return new Date(ts).toLocaleString();
        }

        function getRiskColor(riskLevel) {
            const lvl = String(riskLevel).toLowerCase();
            if (lvl === 'low') return 'success';
            if (lvl === 'medium') return 'warning';
            if (lvl === 'high') return 'danger';
            return 'secondary';
        }

        document.addEventListener('DOMContentLoaded', loadExperimentFiles);
    </script>
</body>
</html>
