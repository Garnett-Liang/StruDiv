<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StruDiv - View Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- StruDiv Unified Styles -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="StruDiv Logo" style="height: 5rem; width: auto; margin-right: 0.5rem;">
                StruDiv
            </a>
            <span class="navbar-text">
                Detecting Reasoning Hallucinations through Structural Step Analysis and Divergence Consensus
            </span>
            <div class="ml-auto">
                <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-file-alt"></i> Experiment Files</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label for="experimentFile" class="form-label">
                                <i class="fas fa-file-alt"></i> Select Experiment File
                            </label>
                            <select class="form-select" id="experimentFile" name="experimentFile">
                                <option value="">-- Loading files... --</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-outline-primary btn-custom" id="loadFileBtn">
                            <i class="fas fa-file-import"></i> Load Selected File
                        </button>
                    </div>
                </div>

                <div id="fileResultSection" class="mt-4" style="display: none;">
                    <div class="card shadow">
                        <div class="card-header">
                            <h4 class="mb-0"><i class="fas fa-chart-bar"></i> Experiment Result</h4>
                        </div>
                        <div class="card-body result-section" id="resultContent">
                            <div class="text-center">
                                <div class="spinner-border spinner-border-sm" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <span>Loading experiment result...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
